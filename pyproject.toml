[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "traffic-violation"
version = "0.1.0"
description = "Configurable traffic-violation detection and explanation pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Cansu Kalkan" }]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9",
  "pytest-cov>=5,<7",
  "mypy>=1.11,<2",
  "ruff>=0.7,<1",
  "types-PyYAML>=6.0,<7",
]
ml = [
  "torch>=2.5,<3",
  "ultralytics==8.4.183",
]
vlm = [
  "accelerate>=1.2,<2",
  "Pillow>=10,<13",
  "torch>=2.5,<3",
  "transformers>=5,<6",
]
quant = [
  "bitsandbytes>=0.45,<1",
]
optimize = [
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
]
web = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
tv = "traffic_violation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_violation"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["gpu: requires a CUDA-capable GPU"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/traffic_violation/reporting/portfolio.py" = ["E501"]
"src/traffic_violation/web/app.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["traffic_violation"]

[[tool.mypy.overrides]]
module = [
  "PIL",
  "PIL.*",
  "torch",
  "torch.*",
  "transformers",
  "transformers.*",
  "ultralytics",
  "ultralytics.*",
  "fastapi",
  "fastapi.*",
  "starlette",
  "starlette.*",
]
ignore_missing_imports = true

